
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Buddy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  height: 70px;
  padding: 12px 16px;
  background: #1c1c1c;
  border-bottom: 1px solid #333;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  font-size: 21px;
  margin: 0;
}

button {
  cursor: pointer;
  border: none;
}

#newChat {
  padding: 10px 14px;
  border-radius: 12px;
  background: #333;
  color: white;
  border: 1px solid #555;
  font-size: 14px;
}

#chat {
  height: calc(100dvh - 190px);
  overflow-y: auto;
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  max-width: 85%;
  padding: 12px 15px;
  border-radius: 19px;
  font-size: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  align-self: flex-end;
  background: #f1f1f1;
  color: #111;
}

.bot {
  align-self: flex-start;
  background: #292929;
  color: white;
}

/* 답변 작성 중 표시 */
.loading {
  color: rgba(255, 255, 255, 0.48);
  font-size: 13px;
  animation: softFade 1.8s ease-in-out infinite;
}

@keyframes softFade {
  0%, 100% {
    opacity: 0.55;
  }
  50% {
    opacity: 0.9;
  }
}

footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 10px 14px 16px;
  background: #1c1c1c;
  border-top: 1px solid #333;
}

.input-area {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px;
  background: #292929;
  border: 1px solid #444;
  border-radius: 20px;
}

#messageInput {
  flex: 1;
  min-width: 0;
  padding: 10px;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 15px;
}

#sendButton {
  width: 45px;
  height: 45px;
  flex-shrink: 0;
  border-radius: 13px;
  background: white;
  color: black;
  font-size: 24px;
}

#sendButton:disabled {
  opacity: 0.5;
}

.bottom-text {
  text-align: center;
  color: #777;
  margin-top: 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>Chat Buddy</h1>
  <button id="newChat">새 대화</button>
</header>

<main id="chat"></main>

<footer>
  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="메시지를 입력하세요..."
      autocomplete="off"
    >
    <button id="sendButton">↑</button>
  </div>
  <div class="bottom-text">Chat Buddy AI</div>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const newChatButton = document.getElementById("newChat");

let messages = [];

try {
  messages = JSON.parse(
    localStorage.getItem("chatBuddyHistory") || "[]"
  );

  if (!Array.isArray(messages)) messages = [];
} catch {
  messages = [];
}

function saveMessages() {
  localStorage.setItem(
    "chatBuddyHistory",
    JSON.stringify(messages)
  );
}

function addMessage(text, type, save = true) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  if (save) {
    messages.push({ text, type });
    saveMessages();
  }

  return div;
}

function showHistory() {
  chat.innerHTML = "";

  messages.forEach(item => {
    addMessage(item.text, item.type, false);
  });
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function requestAI(text) {
  let lastError;

  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const controller = new AbortController();

      const timeout = setTimeout(() => {
        controller.abort();
      }, 90000);

      let response;

      try {
        response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          }),
          signal: controller.signal
        });
      } finally {
        clearTimeout(timeout);
      }

      const responseText = await response.text();

      let data;

      try {
        data = JSON.parse(responseText);
      } catch {
        throw new Error(
          "서버 응답을 읽을 수 없습니다. Render 서버를 확인해 주세요."
        );
      }

      if (!response.ok) {
        const error = new Error(
          data.error || "AI 서버 오류"
        );

        error.retryable =
          response.status === 429 ||
          response.status >= 500;

        throw error;
      }

      if (!data.reply) {
        throw new Error("AI 답변을 받지 못했어요.");
      }

      return data.reply;

    } catch (error) {
      lastError = error;

      const retryable =
        error.name === "AbortError" ||
        error instanceof TypeError ||
        error.retryable === true;

      if (!retryable || attempt === 2) {
        throw error;
      }

      await wait((attempt + 1) * 1500);
    }
  }

  throw lastError;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || sendButton.disabled) return;

  addMessage(text, "user");
  input.value = "";
  sendButton.disabled = true;

  const loading = addMessage(
    "답변을 작성하고 있습니다...",
    "bot loading",
    false
  );

  try {
    const reply = await requestAI(text);

    loading.remove();
    addMessage(reply, "bot");

  } catch (error) {
    loading.remove();

    let message = error.message;

    if (error.name === "AbortError") {
      message = "응답 시간이 초과됐어요. 다시 시도해 주세요.";
    } else if (error instanceof TypeError) {
      message = "서버에 연결할 수 없어요. Render 상태를 확인해 주세요.";
    }

    addMessage("오류: " + message, "bot");

  } finally {
    sendButton.disabled = false;
    input.focus();
  }
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    sendMessage();
  }
});

newChatButton.addEventListener("click", () => {
  messages = [];
  localStorage.removeItem("chatBuddyHistory");
  chat.innerHTML = "";
  input.focus();
});

showHistory();
</script>

</body>
</html>
