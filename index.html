
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Buddy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: #111111;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

header {
  height: 65px;
  padding: 0 18px;
  background: #1c1c1c;
  border-bottom: 1px solid #333333;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

button {
  cursor: pointer;
}

.new-chat {
  background: #333333;
  color: #ffffff;
  border: 1px solid #555555;
  border-radius: 9px;
  padding: 10px 14px;
}

main {
  flex: 1;
  overflow-y: auto;
  padding: 20px 15px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.welcome {
  margin: auto 0;
  text-align: center;
}

.welcome h1 {
  font-size: 27px;
}

.welcome p {
  color: #999999;
  font-size: 14px;
}

.message {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 15px;
  font-size: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  align-self: flex-end;
  background: #eeeeee;
  color: #111111;
}

.bot {
  align-self: flex-start;
  background: #292929;
  color: #ffffff;
}

footer {
  padding: 12px 14px;
  background: #1c1c1c;
  border-top: 1px solid #333333;
}

.input-area {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 7px 6px 14px;
  background: #292929;
  border: 1px solid #444444;
  border-radius: 15px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 12px 0;
  background: transparent;
  border: none;
  outline: none;
  color: #ffffff;
  font-size: 15px;
}

input::placeholder {
  color: #999999;
}

.send {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 10px;
  background: #eeeeee;
  color: #111111;
  font-size: 22px;
}

.send:disabled {
  opacity: 0.4;
}

.notice {
  margin-top: 9px;
  text-align: center;
  color: #777777;
  font-size: 11px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Chat Buddy</div>
  <button class="new-chat" onclick="newChat()">새 대화</button>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <h1>무엇이든 물어보세요.</h1>
    <p>Chat Buddy와 자유롭게 대화하세요.</p>
  </div>
</main>

<footer>
  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="메시지를 입력하세요..."
      autocomplete="off"
    >
    <button class="send" id="send" onclick="sendMessage()">↑</button>
  </div>
  <div class="notice">
    Chat Buddy AI
  </div>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendButton = document.getElementById("send");

let history = [];

function addMessage(text, type) {
  const welcome = document.getElementById("welcome");

  if (welcome) welcome.remove();

  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;

  return message;
}

function saveHistory() {
  try {
    localStorage.setItem(
      "chatBuddyHistory",
      JSON.stringify(history)
    );
  } catch (error) {
    console.log("기록 저장 실패");
  }
}

function loadHistory() {
  try {
    history = JSON.parse(
      localStorage.getItem("chatBuddyHistory") || "[]"
    );

    if (!Array.isArray(history)) history = [];

    history.slice(-100).forEach(item => {
      addMessage(
        item.text,
        item.role === "user" ? "user" : "bot"
      );
    });
  } catch (error) {
    history = [];
  }
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || sendButton.disabled) return;

  input.value = "";

  addMessage(text, "user");

  history.push({
    role: "user",
    text: text
  });

  saveHistory();

  sendButton.disabled = true;

  const loading = addMessage(
    "답변을 작성하고 있습니다.",
    "bot"
  );

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "AI 연결에 실패했습니다."
      );
    }

    const answer = data.reply || "답변을 받지 못했습니다.";

    loading.textContent = answer;

    history.push({
      role: "assistant",
      text: answer
    });

    saveHistory();

  } catch (error) {
    loading.textContent =
      "오류: " + error.message;
  }

  sendButton.disabled = false;
  input.focus();
  chat.scrollTop = chat.scrollHeight;
}

function newChat() {
  if (!confirm("새 대화를 시작하시겠습니까?")) {
    return;
  }

  history = [];
  localStorage.removeItem("chatBuddyHistory");

  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>무엇이든 물어보세요.</h1>
      <p>Chat Buddy와 자유롭게 대화하세요.</p>
    </div>
  `;
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.isComposing) {
    sendMessage();
  }
});

loadHistory();
</script>

</body>
</html>
