
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Buddy</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#fff;color:#111;
 font-family:Arial,"Noto Sans KR",sans-serif;
}
header{
 height:60px;border-bottom:1px solid #eee;
 display:flex;align-items:center;padding:0 18px;
 font-size:20px;font-weight:700;
}
main{
 max-width:850px;margin:auto;padding:20px;
 min-height:calc(100vh - 145px);
}
#welcome{text-align:center;margin-top:18vh}
#welcome h1{font-size:30px}
#messages{padding-bottom:130px}
.message{margin:24px 0;line-height:1.7;white-space:pre-wrap}
.user{
 background:#f2f2f2;border-radius:18px;
 padding:12px 16px;margin-left:auto;
 max-width:85%;width:fit-content;
}
.ai{padding:4px 2px}
.note{font-size:12px;color:#999;margin-top:9px}
.photo{max-width:220px;border-radius:12px;display:block;margin:8px 0}
.controls{
 position:fixed;bottom:0;left:0;width:100%;
 background:#fff;border-top:1px solid #eee;
 padding:12px;
}
.input-area{
 max-width:800px;margin:auto;display:flex;
 align-items:center;gap:8px;
 border:1px solid #ddd;border-radius:24px;
 padding:8px 12px;background:white;
}
textarea{
 flex:1;border:0;outline:0;resize:none;
 font-size:16px;max-height:120px;color:#111;
}
button{
 border:0;background:#111;color:white;
 border-radius:50%;width:40px;height:40px;
 font-size:17px;cursor:pointer;
}
.tool{
 background:#f1f1f1;color:#222;
}
button:disabled{opacity:.5}
#status{text-align:center;color:#999;font-size:12px;margin:7px}
</style>
</head>
<body>
<header>Chat Buddy</header>

<main>
 <section id="welcome">
  <h1>무엇을 도와드릴까요?</h1>
  <p style="color:#888">Chat Buddy와 자유롭게 대화해 보세요.</p>
 </section>
 <section id="messages"></section>
</main>

<div class="controls">
 <div class="input-area">
  <button class="tool" onclick="document.getElementById('imageInput').click()" title="사진 첨부">＋</button>
  <input id="imageInput" type="file" accept="image/*" hidden>
  <textarea id="question" rows="1" placeholder="Chat Buddy에게 물어보세요"></textarea>
  <button class="tool" id="micButton" onclick="startVoice()" title="음성 입력">🎙</button>
  <button id="sendButton" onclick="sendMessage()">↑</button>
 </div>
 <div id="status">사진 첨부와 음성 입력을 지원합니다.</div>
</div>

<script>
const input=document.getElementById('question');
const imageInput=document.getElementById('imageInput');
const messages=document.getElementById('messages');
const welcome=document.getElementById('welcome');
const statusText=document.getElementById('status');
let selectedImage=null;

imageInput.addEventListener('change',()=>{
 const file=imageInput.files[0];
 if(!file)return;
 if(!file.type.startsWith('image/')){
  alert('이미지 파일만 첨부할 수 있습니다.');
  return;
 }
 if(file.size>5*1024*1024){
  alert('사진은 5MB 이하로 선택해 주세요.');
  imageInput.value='';
  return;
 }
 selectedImage=file;
 statusText.textContent='사진 첨부됨: '+file.name;
});

function addMessage(text,type,imageUrl){
 welcome.style.display='none';
 const box=document.createElement('div');
 box.className='message '+type;
 if(imageUrl){
  const img=document.createElement('img');
  img.src=imageUrl;img.className='photo';
  box.appendChild(img);
 }
 const content=document.createElement('div');
 content.textContent=text;
 box.appendChild(content);

 if(type==='ai'){
  const note=document.createElement('div');
  note.className='note';
  note.textContent='검색결과가 늦게 반영될 때, 콘텐츠 노출 변화를 추적하는 방법이 있습니다';
  box.appendChild(note);

  const speak=document.createElement('button');
  speak.className='tool';
  speak.style.cssText='width:auto;height:auto;border-radius:18px;padding:7px 12px;margin-top:8px';
  speak.textContent='답변 듣기';
  speak.onclick=()=>speakText(text);
  box.appendChild(speak);
 }
 messages.appendChild(box);
 window.scrollTo(0,document.body.scrollHeight);
}

async function sendMessage(){
 const message=input.value.trim();
 if(!message&&!selectedImage)return;

 const file=selectedImage;
 const imageUrl=file?URL.createObjectURL(file):null;

 addMessage(message||'이 사진을 분석해 줘.', 'user',imageUrl);
 input.value='';
 selectedImage=null;
 imageInput.value='';
 statusText.textContent='답변을 작성하고 있습니다...';

 try{
  let response;
  if(file){
   const form=new FormData();
   form.append('message',message||'이 사진을 분석해 줘.');
   form.append('image',file);
   response=await fetch('/api/chat',{method:'POST',body:form});
  }else{
   response=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message})
   });
  }

  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'서버 오류가 발생했습니다.');
  addMessage(data.reply||'답변을 받지 못했습니다.','ai');
  statusText.textContent='';
 }catch(error){
  addMessage('오류가 발생했어요: '+error.message,'ai');
  statusText.textContent='잠시 후 다시 시도해 주세요.';
 }
}

function startVoice(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  alert('현재 브라우저에서는 음성 입력을 지원하지 않습니다. Chrome에서 시도해 주세요.');
  return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang='ko-KR';
 recognition.interimResults=false;
 recognition.onstart=()=>statusText.textContent='말씀해 주세요...';
 recognition.onresult=(event)=>{
  input.value=event.results[0][0].transcript;
  statusText.textContent='음성 입력 완료';
 };
 recognition.onerror=()=>statusText.textContent='마이크 권한을 확인해 주세요.';
 recognition.onend=()=>{};
 recognition.start();
}

function speakText(text){
 if(!('speechSynthesis' in window)){
  alert('음성 읽기를 지원하지 않는 브라우저입니다.');
  return;
 }
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang='ko-KR';
 speechSynthesis.speak(utterance);
}

input.addEventListener('keydown',event=>{
 if(event.key==='Enter'&&!event.shiftKey){
  event.preventDefault();sendMessage();
 }
});
</script>
</body>
</html>
