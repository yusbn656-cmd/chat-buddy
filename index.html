
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Buddy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 90px;
      padding: 20px;
      background: #1c1c1c;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 28px;
      margin: 0;
    }

    button {
      cursor: pointer;
      border: none;
    }

    #newChat {
      padding: 15px 20px;
      border-radius: 15px;
      background: #333;
      color: white;
      border: 1px solid #555;
      font-size: 16px;
    }

    #chat {
      height: calc(100dvh - 250px);
      overflow-y: auto;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      max-width: 85%;
      padding: 18px 20px;
      border-radius: 25px;
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #f1f1f1;
      color: #111;
    }

    .bot {
      align-self: flex-start;
      background: #292929;
      color: white;
    }

    .loading {
      color: #aaa;
      font-size: 15px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 15px 20px 25px;
      background: #1c1c1c;
      border-top: 1px solid #333;
    }

    .input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: #292929;
      border: 1px solid #444;
      border-radius: 25px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 12px;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 17px;
    }

    #sendButton {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      border-radius: 18px;
      background: white;
      color: black;
      font-size: 30px;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    .bottom-text {
      text-align: center;
      color: #777;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>Chat Buddy</h1>
  <button id="newChat">새 대화</button>
</header>

<main id="chat"></main>

<footer>
  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="메시지를 입력하세요..."
      autocomplete="off"
    >
    <button id="sendButton">↑</button>
  </div>
  <div class="bottom-text">Chat Buddy AI</div>
</footer>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const newChatButton = document.getElementById("newChat");

  let messages = [];

  try {
    messages = JSON.parse(
      localStorage.getItem("chatBuddyHistory") || "[]"
    );

    if (!Array.isArray(messages)) messages = [];
  } catch {
    messages = [];
  }

  function saveMessages() {
    try {
      localStorage.setItem(
        "chatBuddyHistory",
        JSON.stringify(messages)
      );
    } catch (error) {
      console.error("대화 저장 실패:", error);
    }
  }

  function addMessage(text, type, save = true) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    if (save) {
      messages.push({ text, type });
      saveMessages();
    }

    return div;
  }

  function showHistory() {
    chat.innerHTML = "";

    messages.forEach(item => {
      addMessage(item.text, item.type, false);
    });
  }

  async function sendMessage() {
    const text = input.value.trim();

    if (!text || sendButton.disabled) return;

    addMessage(text, "user");

    input.value = "";
    sendButton.disabled = true;

    const loading = document.createElement("div");
    loading.className = "message bot loading";
    loading.textContent = "답변을 작성하고 있습니다...";
    chat.appendChild(loading);
    chat.scrollTop = chat.scrollHeight;

    try {
      const controller = new AbortController();
      const timeout = setTimeout(
        () => controller.abort(),
        90000
      );

      let response;

      try {
        response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          }),
          signal: controller.signal
        });
      } finally {
        clearTimeout(timeout);
      }

      const resultText = await response.text();

      let data;

      try {
        data = JSON.parse(resultText);
      } catch {
        throw new Error(
          "서버에서 올바르지 않은 응답을 받았습니다. Render 배포 상태를 확인해 주세요."
        );
      }

      if (!response.ok) {
        throw new Error(
          data.error || "AI 서버 오류가 발생했습니다."
        );
      }

      if (!data.reply) {
        throw new Error("AI 답변이 비어 있습니다.");
      }

      loading.remove();
      addMessage(data.reply, "bot");

    } catch (error) {
      loading.remove();

      let errorMessage;

      if (error.name === "AbortError") {
        errorMessage =
          "응답 시간이 초과됐어요. 잠시 후 다시 시도해 주세요.";
      } else if (error instanceof TypeError) {
        errorMessage =
          "서버에 연결할 수 없어요. Render 상태를 확인해 주세요.";
      } else {
        errorMessage = error.message;
      }

      addMessage("오류: " + errorMessage, "bot");

    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  }

  sendButton.addEventListener("click", sendMessage);

  input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  newChatButton.addEventListener("click", () => {
    messages = [];
    localStorage.removeItem("chatBuddyHistory");
    chat.innerHTML = "";
    input.focus();
  });

  showHistory();
</script>

</body>
</html>
