<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Buddy</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://js.tosspayments.com/v2/standard"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f4f4f4;color:#111;
 font-family:Arial,"Noto Sans KR",sans-serif
}
button{cursor:pointer;border:0;font-family:inherit}

/* 처음 진입 온보딩 (무채색 배경 + 영상) */
#onboarding{
 position:fixed;inset:0;z-index:30;
 display:flex;flex-direction:column;justify-content:space-between;
 padding:28px 22px 26px;
 background:#efefef;color:#111;overflow:hidden
}
#bgVideo{
 position:absolute;inset:0;width:100%;height:100%;
 object-fit:cover;z-index:0;
 filter:grayscale(100%) brightness(1.06) contrast(1.03);
 opacity:.38;pointer-events:none
}
.mono-overlay{
 position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(
  180deg,
  rgba(245,245,245,0.72) 0%,
  rgba(235,235,235,0.62) 50%,
  rgba(245,245,245,0.88) 100%
 )
}
.onboard-inner{
 position:relative;z-index:2;
 width:100%;max-width:420px;height:100%;margin:0 auto;
 display:flex;flex-direction:column;justify-content:space-between
}
.step-bars{
 display:flex;gap:6px;width:140px;margin:0 auto
}
.step-bar{
 flex:1;height:3px;border-radius:999px;
 background:rgba(17,17,17,0.16);transition:.25s
}
.step-bar.active{background:#111}

.onboard-stage{
 flex:1;display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 text-align:center;padding:16px 4px
}
.mono-icon-box{
 width:96px;height:96px;border-radius:24px;
 background:rgba(255,255,255,0.78);
 border:1px solid rgba(17,17,17,0.12);
 display:flex;align-items:center;justify-content:center;
 font-size:34px;font-weight:800;color:#222;
 margin-bottom:24px;box-shadow:0 10px 28px rgba(0,0,0,0.06)
}
.onboard-title{
 font-size:27px;font-weight:800;line-height:1.3;margin:0 0 12px;color:#111
}
.onboard-desc{
 font-size:15px;line-height:1.6;color:#555;margin:0;max-width:340px
}
.consent-box{
 width:100%;max-height:250px;overflow:auto;text-align:left;
 background:rgba(255,255,255,0.82);border:1px solid rgba(17,17,17,0.12);
 border-radius:16px;padding:14px;font-size:12.5px;line-height:1.65;color:#333
}

.onboard-bottom{width:100%}
.primary-pill-btn{
 width:100%;padding:16px;border-radius:999px;
 background:#111;color:#fff;font-size:16px;font-weight:700
}
.onboard-links{
 margin-top:12px;text-align:center;font-size:12px;color:#666
}

/* 로그인 화면 */
#login{
 position:fixed;inset:0;background:#f5f5f5;z-index:20;
 display:none;align-items:center;justify-content:center;padding:20px
}
#login.show{display:flex}
.login-box{
 width:100%;max-width:380px;text-align:center;
 background:#fff;padding:28px 22px;border-radius:22px;
 border:1px solid #e5e5e5
}
.login-box h1{font-size:32px;margin:0 0 10px}
.login-box p{color:#777;margin:0 0 24px}
.login-btn{
 width:100%;padding:15px;border:1px solid #ddd;
 border-radius:12px;background:white;color:#111;
 font-size:16px;margin:7px 0
}
.login-btn.dark{background:#111;color:white;border-color:#111}
#loginStatus{font-size:13px;line-height:1.5;margin-top:12px!important}

#app{display:none;height:100dvh}
#sidebar{
 position:fixed;left:0;top:0;bottom:0;width:270px;
 background:#f7f7f7;padding:16px;z-index:10;
 display:flex;flex-direction:column;
 transform:translateX(-100%);transition:.2s
}
#sidebar.open{transform:translateX(0)}
.side-btn{
 width:100%;padding:13px;text-align:left;background:transparent;
 border-radius:10px;color:#222;font-size:15px;margin-bottom:5px
}
.side-btn:hover,.history-item:hover{background:#eaeaea}
#history{overflow:auto;flex:1;margin-top:12px}
.history-item{
 padding:10px;border-radius:8px;cursor:pointer;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px
}
#userInfo{border-top:1px solid #ddd;padding-top:12px;font-size:13px;color:#555}
.plan-badge{
 display:inline-block;margin:6px 0 8px;padding:4px 8px;
 border-radius:999px;font-size:12px;font-weight:700;
 background:#ececec;color:#333
}
.plan-badge.premium{
 background:#111;color:#fff
}
#shade{display:none;position:fixed;inset:0;background:#0005;z-index:9}
#shade.show{display:block}

#main{height:100%;display:flex;flex-direction:column}
header{
 height:60px;border-bottom:1px solid #eee;
 display:flex;align-items:center;padding:0 16px;
 gap:8px;flex-shrink:0
}
#menu{font-size:24px;background:white;color:#111;padding:0 4px 0 0}
#title{font-size:19px;font-weight:700}
#headerPlanBadge{
 padding:4px 9px;border-radius:999px;
 font-size:11px;font-weight:700;line-height:1.2;
 background:#f1f1f1;color:#333;
 white-space:nowrap
}
#headerPlanBadge.premium{
 background:#111;color:#fff
}

/* 결제 모달 */
#payModal{
 display:none;position:fixed;inset:0;background:#0006;z-index:40;
 align-items:center;justify-content:center;padding:20px
}
#payModal.show{display:flex}
.pay-card{
 width:100%;max-width:380px;background:#fff;border-radius:18px;
 padding:22px;box-shadow:0 12px 32px #0002
}
.pay-card h2{margin:0 0 8px;font-size:20px}
.pay-price{font-size:24px;font-weight:800;margin:10px 0 14px}
.pay-price span{font-size:13px;font-weight:400;color:#666}
.pay-list{margin:0 0 18px;padding-left:18px;color:#444;font-size:14px;line-height:1.7}
.pay-actions{display:flex;gap:8px}
.pay-actions button{
 flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:700
}
.pay-cancel{background:#f1f1f1;color:#333}
.pay-submit{background:#111;color:#fff}

#messages{
 flex:1;overflow:auto;width:100%;max-width:850px;
 margin:auto;padding:20px 20px 30px
}
#welcome{text-align:center;margin-top:17vh}
#welcome h1{font-size:28px}
#welcome p{color:#888}

.message{
 margin:25px 0;line-height:1.75;
 white-space:pre-wrap;overflow-wrap:anywhere
}
.user{
 background:#f2f2f2;border-radius:20px;padding:12px 16px;
 margin-left:auto;max-width:85%;width:fit-content
}
.ai{padding:4px 2px;color:#111}
.ai-content{color:#111}
.note{font-size:12px;color:#999;margin-top:10px}

.photo{
 max-width:220px;max-height:220px;object-fit:contain;
 border-radius:12px;display:block;margin-bottom:8px
}

.typing-indicator{
 display:inline-block;
 color:#999;
 font-size:15px;
 background:linear-gradient(
  90deg,#aaa 0%,#dedede 45%,#999 70%
 );
 background-size:200% auto;
 background-clip:text;
 -webkit-background-clip:text;
 -webkit-text-fill-color:transparent;
 animation:typingShimmer 1.5s linear infinite;
}
.typing-dots{
 display:inline-flex;
 gap:4px;
 margin-left:5px;
 vertical-align:middle
}
.typing-dots span{
 width:5px;height:5px;border-radius:50%;
 background:#aaa;
 animation:dotPulse 1s infinite ease-in-out
}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}

@keyframes typingShimmer{
 0%{background-position:100% center}
 100%{background-position:-100% center}
}
@keyframes dotPulse{
 0%,80%,100%{opacity:.3;transform:scale(.8)}
 40%{opacity:1;transform:scale(1)}
}

#bottom{border-top:1px solid #eee;padding:12px;background:white}
#inputArea{
 max-width:800px;margin:auto;display:flex;align-items:center;
 gap:8px;border:1px solid #ddd;border-radius:28px;padding:8px 12px
}
#question{
 flex:1;min-width:0;border:0;outline:0;resize:none;
 font-size:16px;max-height:120px;color:#111;font-family:inherit
}
.tool{
 width:42px;height:42px;border-radius:50%;
 background:#f1f1f1;color:#222;
 display:flex;align-items:center;justify-content:center;
 flex-shrink:0
}
.tool svg{width:21px;height:21px;stroke:currentColor}
#mic{
 background:#f2f2f2;color:#222;
 transition:background .2s,color .2s,transform .2s
}
#mic:active{transform:scale(.94)}
#mic.listening{
 background:#d93025;color:white;
 animation:micPulse 1.2s infinite
}
@keyframes micPulse{
 0%,100%{box-shadow:0 0 0 0 #d9302533}
 50%{box-shadow:0 0 0 7px #d9302515}
}
#send{
 background:#111;color:white;width:44px;height:44px;
 border-radius:50%;font-size:23px
}
#status{
 text-align:center;color:#999;font-size:12px;margin-top:8px;
 min-height:14px
}
#searchBox{
 width:100%;padding:10px;border:1px solid #ddd;
 border-radius:10px;margin:8px 0
}

@media(min-width:800px){
 #sidebar{transform:translateX(0)}
 #main{margin-left:270px}
 #shade{display:none!important}
}
</style>
</head>

<body>

<!-- 진입 시 무채색 영상 배경 온보딩 -->
<div id="onboarding">
 <video id="bgVideo" autoplay muted loop playsinline>
  <source src="/intro-bg.mp4" type="video/mp4">
 </video>
 <div class="mono-overlay"></div>

 <div class="onboard-inner">
  <div class="step-bars" id="stepBars">
   <span class="step-bar active"></span>
   <span class="step-bar"></span>
   <span class="step-bar"></span>
   <span class="step-bar"></span>
  </div>

  <div class="onboard-stage" id="onboardStage"></div>

  <div class="onboard-bottom">
   <button id="onboardNextBtn" type="button" class="primary-pill-btn" onclick="nextOnboardStep()">
    시작하기
   </button>
   <div id="onboardLinks" class="onboard-links">이용약관 · 개인정보 처리방침</div>
  </div>
 </div>
</div>

<!-- 로그인 화면 -->
<div id="login">
 <div class="login-box">
  <h1>Chat Buddy</h1>
  <p>무엇이든 편하게 물어보세요.</p>
  <button class="login-btn" onclick="googleLogin()">Google로 계속하기</button>
  <button class="login-btn dark" onclick="guestLogin()">게스트로 시작하기</button>
  <p id="loginStatus"></p>
 </div>
</div>

<div id="shade" onclick="toggleMenu()"></div>

<div id="sidebar">
 <button class="side-btn" onclick="newChat()">＋ 새 채팅</button>
 <button class="side-btn" onclick="showSearch()">⌕ 채팅 검색</button>
 <button class="side-btn" onclick="showLibrary()">▤ 자료실</button>
 <input id="searchBox" placeholder="대화 검색"
  style="display:none" oninput="searchChats(this.value)">
 <div id="history"></div>
 <div id="userInfo">
  <div id="userEmail"></div>
  <div id="userPlanBadge" class="plan-badge">무료 등급</div>
  <button class="side-btn" onclick="logout()">로그아웃</button>
 </div>
</div>

<!-- 토스페이먼츠 결제 확인 모달 -->
<div id="payModal" onclick="if(event.target===this) closePayModal()">
 <div class="pay-card">
  <h2>Chet Buddy Premium</h2>
  <div class="pay-price">4,900원 <span>/ 30일 이용권</span></div>
  <ul class="pay-list">
   <li>더 빠르고 똑똑한 프리미엄 모델 답변</li>
   <li>더 길고 깊이 있는 맞춤 설명</li>
   <li>Google 계정 전용 멤버십 (게스트 불가)</li>
  </ul>
  <div class="pay-actions">
   <button type="button" class="pay-cancel" onclick="closePayModal()">취소</button>
   <button type="button" class="pay-submit" onclick="startTossPayment()">토스로 결제하기</button>
  </div>
 </div>
</div>

<div id="app">
 <div id="main">
  <header>
   <button id="menu" onclick="toggleMenu()">☰</button>
   <div id="title">Chat Buddy</div>
   <button id="headerPlanBadge" type="button" onclick="handlePremiumUpgrade()">Chet Buddy Premium 시작하기</button>
  </header>

  <section id="messages">
   <div id="welcome">
    <h1>무엇을 도와드릴까요?</h1>
    <p>Chat Buddy와 자유롭게 대화해 보세요.</p>
   </div>
  </section>

  <div id="bottom">
   <div id="inputArea">

    <button class="tool" aria-label="사진 첨부"
     onclick="document.getElementById('imageInput').click()">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
     </svg>
    </button>

    <input id="imageInput" type="file" accept="image/*" hidden>

    <textarea id="question" rows="1"
     placeholder="Chat Buddy에게 물어보세요"></textarea>

    <button class="tool" id="mic" aria-label="음성 입력"
     onclick="startVoice()">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2" width="6" height="12" rx="3"/>
      <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
      <path d="M12 19v3M8 22h8"/>
     </svg>
    </button>

    <button id="send" onclick="sendMessage()" aria-label="전송">↑</button>
   </div>
   <div id="status"></div>
  </div>
 </div>
</div>

<script>
// Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyDY3NjN9XhBmYuaioue1Zw1Xt_hzOzQ4M4",
  authDomain: "chatbuddy-a1e78.firebaseapp.com",
  projectId: "chatbuddy-a1e78",
  storageBucket: "chatbuddy-a1e78.firebasestorage.app",
  messagingSenderId: "238364880773",
  appId: "1:238364880773:web:0281f439d192b32157deec",
  measurementId: "G-N6P62LE9W9"
};

const TOSS_CLIENT_KEY = "test_ck_여기에_토스_클라이언트키_입력";
const PREMIUM_AMOUNT = 4900;

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

const onboardingEl = document.getElementById("onboarding");
const onboardStageEl = document.getElementById("onboardStage");
const onboardNextBtnEl = document.getElementById("onboardNextBtn");
const onboardLinksEl = document.getElementById("onboardLinks");
const login = document.getElementById("login");
const app = document.getElementById("app");
const messages = document.getElementById("messages");
const input = document.getElementById("question");
const imageInput = document.getElementById("imageInput");
const statusText = document.getElementById("status");
const micButton = document.getElementById("mic");

const onboardSteps = [
  {
    icon: "CB",
    title: "Chat Buddy",
    desc: "당신의 일상 AI 어시스턴트. 무엇이든 편하게 물어보세요.",
    btn: "시작하기",
    links: "이용약관 · 개인정보 처리방침"
  },
  {
    icon: "PRO",
    title: "더 빠르고 똑똑한\nChet Buddy Premium",
    desc: "상위 모델과 확장된 응답으로 질문에 더 정확하고 깊게 답합니다.",
    btn: "다음 >",
    links: ""
  },
  {
    icon: "AI",
    title: "사진과 음성으로\n더 쉽게 대화하세요",
    desc: "사진 첨부와 음성 입력으로 언제 어디서든 바로 질문할 수 있습니다.",
    btn: "다음 >",
    links: ""
  },
  {
    icon: "✓",
    title: "Chat Buddy에 오신 것을\n환영합니다",
    desc: "서비스 이용을 위한 안내를 확인해 주세요.",
    btn: "동의하고 계속하기 >",
    links: "",
    isConsent: true
  }
];

let onboardIndex = 0;

function renderOnboardStep() {
  const step = onboardSteps[onboardIndex];
  const bars = document.querySelectorAll("#stepBars .step-bar");
  bars.forEach((bar, idx) => {
    bar.classList.toggle("active", idx === onboardIndex);
  });

  if (step.isConsent) {
    onboardStageEl.innerHTML = `
      <div class="mono-icon-box">${step.icon}</div>
      <h2 class="onboard-title">${step.title.replace("\n", "<br>")}</h2>
      <div class="consent-box">
        입력하신 메시지와 첨부 파일은 AI 답변 생성을 위해 서버 및 AI 모델 API로 전송되어 처리됩니다.<br><br>
        게스트 로그인은 무료 등급으로 제공되며, Chet Buddy Premium(월 4,900원)은 Google 로그인 계정에 한해 적용됩니다.<br><br>
        '동의하고 계속하기'를 누르면 안내에 동의한 것으로 간주하고 로그인 화면으로 이동합니다.
      </div>
    `;
  } else {
    onboardStageEl.innerHTML = `
      <div class="mono-icon-box">${step.icon}</div>
      <h2 class="onboard-title">${step.title.replace("\n", "<br>")}</h2>
      <p class="onboard-desc">${step.desc}</p>
    `;
  }

  onboardNextBtnEl.textContent = step.btn;
  onboardLinksEl.textContent = step.links;
}

function nextOnboardStep() {
  if (onboardIndex < onboardSteps.length - 1) {
    onboardIndex += 1;
    renderOnboardStep();
  } else {
    onboardingEl.style.display = "none";
    if (!currentUser) {
      login.classList.add("show");
    }
  }
}

renderOnboardStep();

let currentUser = null;
let currentPlan = "free";
let chats = [];
let currentChat = null;
let selectedImage = null;
let recognition = null;
let isListening = false;

function isGoogleUser(user) {
  return Boolean(user && !user.isAnonymous);
}

function getAuthProviderName(user) {
  return isGoogleUser(user) ? "google" : "guest";
}

function planStorageKey(user) {
  return "chatBuddyPlan_" + user.uid;
}

function loadUserPlan(user) {
  if (!isGoogleUser(user)) {
    return "free";
  }
  const saved = localStorage.getItem(planStorageKey(user));
  return saved === "premium" ? "premium" : "free";
}

function saveUserPlan(user, plan) {
  if (!isGoogleUser(user)) {
    currentPlan = "free";
    renderPlanUI();
    return;
  }
  const normalized = plan === "premium" ? "premium" : "free";
  currentPlan = normalized;
  localStorage.setItem(planStorageKey(user), normalized);
  renderPlanUI();
}

function renderPlanUI() {
  const badge = document.getElementById("userPlanBadge");
  const headerBadge = document.getElementById("headerPlanBadge");

  const google = isGoogleUser(currentUser);
  const isPremium = google && currentPlan === "premium";

  if (badge) {
    badge.textContent = isPremium
      ? "Chet Buddy Premium (₩4,900/월)"
      : (google ? "무료 등급 (구글)" : "게스트 · 무료 전용");
    badge.className = isPremium ? "plan-badge premium" : "plan-badge";
  }

  if (headerBadge) {
    headerBadge.textContent = isPremium
      ? "Chet Buddy Premium 이용 중"
      : "Chet Buddy Premium 시작하기";
    headerBadge.className = isPremium ? "premium" : "";
  }
}

function openPayModal() {
  document.getElementById("payModal").classList.add("show");
}

function closePayModal() {
  document.getElementById("payModal").classList.remove("show");
}

function handlePremiumUpgrade() {
  if (!currentUser) return;

  if (!isGoogleUser(currentUser)) {
    const goGoogle = confirm(
      "Chet Buddy Premium(월 4,900원)은 구글 로그인 계정만 이용할 수 있습니다.\n지금 구글 로그인으로 전환할까요?"
    );
    if (goGoogle) {
      googleLogin();
    }
    return;
  }

  if (currentPlan === "premium") {
    alert("이미 Chet Buddy Premium을 이용 중입니다.");
    return;
  }

  openPayModal();
}

async function startTossPayment() {
  if (!currentUser || !isGoogleUser(currentUser)) {
    alert("구글 로그인 후 결제할 수 있습니다.");
    return;
  }

  if (!window.TossPayments) {
    alert("토스페이먼츠 결제 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.");
    return;
  }

  try {
    closePayModal();

    const tossPayments = TossPayments(TOSS_CLIENT_KEY);
    const payment = tossPayments.payment({
      customerKey: "google_" + currentUser.uid
    });

    const orderId = "cbp_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
    const baseUrl = window.location.origin + window.location.pathname;

    await payment.requestPayment({
      method: "CARD",
      amount: {
        currency: "KRW",
        value: PREMIUM_AMOUNT
      },
      orderId: orderId,
      orderName: "Chet Buddy Premium (30일)",
      successUrl: baseUrl + "?tossResult=success",
      failUrl: baseUrl + "?tossResult=fail",
      customerEmail: currentUser.email || undefined,
      customerName: currentUser.displayName || "Chat Buddy 사용자"
    });
  } catch (err) {
    console.error("토스 결제창 오류:", err);
    if (err?.code !== "USER_CANCEL") {
      alert("결제 요청 중 오류가 발생했습니다: " + (err.message || err));
    }
  }
}

async function handleTossRedirectResult(user) {
  const params = new URLSearchParams(window.location.search);
  const tossResult = params.get("tossResult");
  if (!tossResult) return;

  const cleanUrl = window.location.origin + window.location.pathname;

  if (tossResult === "fail") {
    const failMessage = params.get("message") || "결제가 취소되었거나 실패했습니다.";
    window.history.replaceState({}, document.title, cleanUrl);
    alert("결제 실패: " + failMessage);
    return;
  }

  if (tossResult === "success") {
    const paymentKey = params.get("paymentKey");
    const orderId = params.get("orderId");
    const amount = Number(params.get("amount"));

    window.history.replaceState({}, document.title, cleanUrl);

    if (!isGoogleUser(user)) {
      alert("게스트 계정은 프리미엄을 적용할 수 없습니다.");
      return;
    }

    try {
      statusText.textContent = "결제를 확인하고 있습니다...";

      const res = await fetch("/api/payments/toss/confirm", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-auth-provider": "google",
          "x-user-id": user.uid
        },
        body: JSON.stringify({
          provider: "google",
          userId: user.uid,
          paymentKey,
          orderId,
          amount
        })
      });

      const data = await res.json();
      statusText.textContent = "";

      if (!res.ok) {
        throw new Error(data.error || "결제 승인 확인에 실패했습니다.");
      }

      saveUserPlan(user, data.plan || "premium");
      alert("결제가 완료되어 Chet Buddy Premium이 활성화되었습니다!");
    } catch (err) {
      statusText.textContent = "";
      alert("결제 승인 오류: " + err.message);
    }
  }
}

async function syncSubscriptionFromServer(user) {
  if (!isGoogleUser(user)) {
    saveUserPlan(user, "free");
    return;
  }

  try {
    const res = await fetch("/api/subscription/status", {
      headers: {
        "x-auth-provider": "google",
        "x-user-id": user.uid
      }
    });
    if (!res.ok) return;
    const data = await res.json();
    if (data.plan) {
      saveUserPlan(user, data.plan);
    }
  } catch (e) {
    console.warn("구독 상태 조회 실패:", e);
  }
}

function storageKey() {
  return "chatBuddyChats_" + currentUser.uid;
}

function loadChats() {
  try {
    chats = JSON.parse(localStorage.getItem(storageKey()) || "[]");
  } catch (e) {
    chats = [];
  }
  renderHistory();
}

function saveChats() {
  localStorage.setItem(storageKey(), JSON.stringify(chats));
  renderHistory();
}

function googleLogin() {
  document.getElementById("loginStatus").textContent = "Google 로그인 중...";
  auth.signInWithPopup(provider).catch(e => {
    document.getElementById("loginStatus").textContent = "로그인 오류: " + e.message;
  });
}

function guestLogin() {
  document.getElementById("loginStatus").textContent = "게스트 로그인 중...";
  auth.signInAnonymously().catch(e => {
    document.getElementById("loginStatus").textContent = "게스트 로그인 오류: " + e.message;
  });
}

auth.onAuthStateChanged(async user => {
  if (user) {
    currentUser = user;
    currentPlan = loadUserPlan(user);
    onboardingEl.style.display = "none";
    login.classList.remove("show");
    app.style.display = "block";
    document.getElementById("userEmail").textContent =
      user.isAnonymous ? "게스트 계정" : (user.email || "Google 계정");
    renderPlanUI();
    loadChats();
    currentChat = null;
    newChat();

    await handleTossRedirectResult(user);
    await syncSubscriptionFromServer(user);
  } else {
    currentUser = null;
    currentPlan = "free";
    app.style.display = "none";
    if (onboardingEl.style.display === "none") {
      login.classList.add("show");
    }
  }
});

function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("shade").classList.toggle("show");
}

function newChat() {
  if (!currentUser) return;
  currentChat = { id: Date.now(), title: "새 채팅", messages: [] };
  chats.unshift(currentChat);
  saveChats();
  showChat(currentChat);
}

function showChat(chat) {
  currentChat = chat;
  messages.innerHTML = "";

  if (!chat.messages.length) {
    messages.innerHTML =
      '<div id="welcome"><h1>무엇을 도와드릴까요?</h1><p>Chat Buddy와 자유롭게 대화해 보세요.</p></div>';
  }

  chat.messages.forEach(m => addMessage(m.text, m.type, m.image, false));
  renderHistory();
}

function renderHistory() {
  const box = document.getElementById("history");
  box.innerHTML = "";

  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "history-item";
    item.textContent = chat.title;
    item.onclick = () => showChat(chat);
    box.appendChild(item);
  });
}

function addMessage(text, type, image, save = true) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const box = document.createElement("div");
  box.className = "message " + type;

  if (image) {
    const img = document.createElement("img");
    img.src = image;
    img.className = "photo";
    box.appendChild(img);
  }

  const content = document.createElement("div");
  content.className = type === "ai" ? "ai-content" : "";
  content.textContent = text;
  box.appendChild(content);

  if (type === "ai") {
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = "검색결과가 늦게 반영될 때, 콘텐츠 노출 변화를 추적하는 방법이 있습니다";
    box.appendChild(note);
  }

  messages.appendChild(box);
  messages.scrollTop = messages.scrollHeight;

  if (save && currentChat) {
    currentChat.messages.push({ text, type, image: image || null });
    if (type === "user" && currentChat.title === "새 채팅") {
      currentChat.title = text.slice(0, 25) || "사진 질문";
    }
    saveChats();
  }

  return box;
}

function showTyping() {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const box = document.createElement("div");
  box.className = "message ai";
  box.id = "typingMessage";

  const content = document.createElement("div");
  content.className = "typing-indicator";
  content.textContent = "답변을 작성하고 있습니다";

  const dots = document.createElement("span");
  dots.className = "typing-dots";
  dots.innerHTML = "<span></span><span></span><span></span>";

  content.appendChild(dots);
  box.appendChild(content);

  messages.appendChild(box);
  messages.scrollTop = messages.scrollHeight;

  return box;
}

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/") || file.size > 5 * 1024 * 1024) {
    alert("5MB 이하의 이미지 파일을 선택해 주세요.");
    imageInput.value = "";
    return;
  }

  selectedImage = file;
  statusText.textContent = "사진 첨부됨: " + file.name;
});

async function sendMessage() {
  const message = input.value.trim();
  if (!message && !selectedImage) return;

  const file = selectedImage;
  const imageUrl = file ? URL.createObjectURL(file) : null;

  addMessage(message || "이 사진을 분석해 줘.", "user", imageUrl);

  input.value = "";
  input.style.height = "auto";
  selectedImage = null;
  imageInput.value = "";

  statusText.textContent = "";
  const typingBox = showTyping();

  const authProvider = getAuthProviderName(currentUser);
  const uid = currentUser ? currentUser.uid : "guest_default";

  try {
    let response;

    if (file) {
      const form = new FormData();
      form.append("message", message || "이 사진을 분석해 줘.");
      form.append("provider", authProvider);
      form.append("userId", uid);
      form.append("image", file);

      response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "x-auth-provider": authProvider,
          "x-user-id": uid
        },
        body: form
      });
    } else {
      response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-auth-provider": authProvider,
          "x-user-id": uid
        },
        body: JSON.stringify({
          message,
          provider: authProvider,
          userId: uid
        })
      });
    }

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.reply || data.error || "서버 오류");
    }

    if (!data.reply) {
      throw new Error("AI 답변이 비어 있습니다.");
    }

    if (data.plan) {
      saveUserPlan(currentUser, data.plan);
    }

    typingBox.remove();
    addMessage(data.reply, "ai");
    speakText(data.reply);
    statusText.textContent = "";
  } catch (error) {
    typingBox.remove();
    addMessage("오류가 발생했어요: " + error.message, "ai");
    statusText.textContent = "잠시 후 다시 시도해 주세요.";
  }
}

function startVoice() {
  const Recognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Recognition) {
    alert("Chrome 브라우저에서 음성 입력을 시도해 주세요.");
    return;
  }

  if (isListening) {
    recognition.stop();
    return;
  }

  recognition = new Recognition();
  recognition.lang = "ko-KR";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = () => {
    isListening = true;
    micButton.classList.add("listening");
    statusText.textContent = "말씀해 주세요...";
  };

  recognition.onresult = e => {
    input.value = e.results[0][0].transcript;
    statusText.textContent = "음성 입력 완료";
  };

  recognition.onerror = e => {
    statusText.textContent =
      e.error === "not-allowed"
        ? "마이크 권한을 허용해 주세요."
        : "음성 인식 오류가 발생했습니다.";
  };

  recognition.onend = () => {
    isListening = false;
    micButton.classList.remove("listening");
  };

  try {
    recognition.start();
  } catch (e) {
    isListening = false;
    micButton.classList.remove("listening");
    statusText.textContent = "마이크를 다시 눌러 주세요.";
  }
}

function speakText(text) {
  if (!window.speechSynthesis || !text) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ko-KR";
  utterance.rate = 1;
  speechSynthesis.speak(utterance);
}

function showSearch() {
  const box = document.getElementById("searchBox");
  box.style.display = box.style.display === "none" ? "block" : "none";
}

function searchChats(query) {
  const box = document.getElementById("history");
  box.innerHTML = "";

  chats.filter(c =>
    c.title.toLowerCase().includes(query.toLowerCase())
  ).forEach(chat => {
    const item = document.createElement("div");
    item.className = "history-item";
    item.textContent = chat.title;
    item.onclick = () => showChat(chat);
    box.appendChild(item);
  });
}

function showLibrary() {
  alert("자료실 기능은 다음 업데이트에서 연결할 예정입니다.");
}

function logout() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (recognition && isListening) recognition.stop();

  currentChat = null;
  chats = [];
  currentPlan = "free";
  auth.signOut();
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});
</script>
